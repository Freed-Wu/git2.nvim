---
"on":
  push:
    paths-ignore:
      - "**.md"
      - doc/*
  pull_request:
    paths-ignore:
      - "**.md"
      - doc/*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libgit2-dev
      - name: Generate template.lua
        run: |
          perl -00ne 'print if $. == 2' ./*-scm-1.rockspec > template.lua
      - uses: lumen-oss/luarocks-tag-release@v9
        env:
          LUX_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
        with:
          lux-version: latest
          template: template.lua

  deploy:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.runs-on }}
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Install dependencies
        if: runner.os == 'macOS'
        run: |
          brew install libgit2
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libgit2-dev
      - uses: lumen-oss/gh-actions-lux@v1
      - name: Pack
        run: |
          lx pack git2.nvim
      - uses: actions/upload-artifact@v4
        if: "! startsWith(github.ref, 'refs/tags/')"
        with:
          path: |
            *.rock
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.rock
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          scripts/upload.sh ./*.rock
        env:
          LUAROCKS_API_KEY: ${{secrets.LUAROCKS_API_KEY}}
