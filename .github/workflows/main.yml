---
"on":
  push:
    paths-ignore:
      - "**.md"
      - doc/*
  pull_request:
    paths-ignore:
      - "**.md"
      - doc/*
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runs-on:
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Install dependencies
        if: runner.os == 'macOS'
        run: |
          brew install libgit2
      - name: Install dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y update
          sudo apt-get -y install libgit2-dev
      - uses: actions/checkout@v4
      - name: Generate extra.rockspec
        run: |
          perl -00ne 'print if $. == 2' ./*-scm-1.rockspec > extra.rockspec
      - uses: lumen-oss/luarocks-tag-release@v9
        env:
          LUX_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
          GIT2_LIBDIR: /usr/lib/x86_64-linux-gnu
        with:
          lux_version: latest
      - name: Pack
        env:
          GIT2_LIBDIR: /usr/lib/x86_64-linux-gnu
        run: |
          lx --lua-version=5.1 pack
      - uses: actions/upload-artifact@v4
        if: "! startsWith(github.ref, 'refs/tags/')"
        with:
          path: |
            *.rock
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            *.rock
      - name: Upload
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          scripts/upload.sh ./*.rock
        env:
          LUAROCKS_API_KEY: ${{ secrets.LUAROCKS_API_KEY }}
